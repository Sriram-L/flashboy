[package]
name = "flashboy"
version = "0.1.0"
edition = "2021"
description = "Fast TUI for CRUD and judging C++ test cases"
authors = ["Sriram"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
postcard = { version = "1.1", default-features = false, features = ["alloc", "use-std"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
tui-textarea = "0.7"
wait-timeout = "0.2"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
